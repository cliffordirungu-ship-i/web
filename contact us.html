<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright future Training center</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }
        nav {
            background: #003366;
            padding: 0.5em 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 1.5em;
            font-size: 1.1em;
            letter-spacing: 0.5px;
            transition: color 0.2s;
            padding: 0.5em 0;
            display: inline-block;
        }
        nav a:hover {
            color: #ffcc00;
        }
        header {
            position: relative;
            width: 100%;
            height: 320px;
            background: linear-gradient(rgba(0,51,102,0.6), rgba(0,51,102,0.6)), url('https://images.unsplash.com/photo-1503676382389-4809596d5290?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .header-content {
            color: #fff;
            text-align: center;
        }
        .header-content h1 {
            font-size: 2.8em;
            margin: 0 0 0.3em 0;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .header-content p {
            font-size: 1.3em;
            margin: 0;
            font-weight: 400;
        }
        @media (max-width: 600px) {
            .header-content h1 {
                font-size: 2em;
            }
            header {
                height: 180px;
            }
            nav a {
                margin: 0 0.7em;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about us.html">About</a>
        <a href="courses.html">Courses</a>
        <a href="contact us.html">Contact</a>
        <a href="services.html">services</a>
    </nav>
    <header>
        <div class="header-content">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you! Reach out for any queries or support.</p>
        </div>
    </header>
</body>
</html>
