<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Our Services</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 2rem;
			color: #fff;
			font-family: Arial, sans-serif;
			background:
				linear-gradient(rgba(12, 24, 40, 0.65), rgba(12, 24, 40, 0.65)),
				url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=2000&q=85") center / cover no-repeat fixed;
		}

		main {
			width: min(100%, 700px);
			padding: 3rem 2rem;
			text-align: center;
			background: rgba(15, 23, 42, 0.78);
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 16px;
			backdrop-filter: blur(6px);
		}

		h1 {
			margin-top: 0;
			font-size: clamp(2rem, 6vw, 3.5rem);
		}

		p {
			line-height: 1.6;
		}

		a {
			display: inline-block;
			margin-top: 1rem;
			padding: 0.8rem 1.2rem;
			color: #102033;
			background: #fff;
			border-radius: 6px;
			text-decoration: none;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<main>
		<h1>Our Services</h1>
		<p>Thoughtful solutions to help your business grow. Explore how we can work together.</p>
		<a href="#services">Explore services</a>
	</main>
</body>
</html>
